name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -t ghcr.io/iamrobins/elina:latest .
      - run: docker run --rm --entrypoint bun ghcr.io/iamrobins/elina:latest --version
      - run: docker push ghcr.io/iamrobins/elina:latest
