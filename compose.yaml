services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: elina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: elina
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elina -d elina"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  migrate:
    image: ghcr.io/iamrobins/elina:latest
    build: .
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://elina:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/elina
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: ghcr.io/iamrobins/elina:latest
    environment:
      DATABASE_URL: postgres://elina:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/elina
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      ATTRIBUTE_DENYLIST: ${ATTRIBUTE_DENYLIST:-}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ghcr.io/iamrobins/elina:latest
    command: ["node", "elina-web/node_modules/next/dist/bin/next", "start", "elina-web", "-p", "3001"]
    environment:
      ELINA_API_INTERNAL_URL: http://api:3000
      ELINA_BACKEND_ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      DASHBOARD_PASSWORD_HASH: ${DASHBOARD_PASSWORD_HASH:?Set DASHBOARD_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
